<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SurfSchool</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><path fill='%230077B6' d='M439 230c-26 0-51 10-70 27-20-17-44-27-70-27s-51 10-70 27c-20-17-44-27-70-27s-51 10-70 27c-17-15-40-23-64-23-45 0-82 34-87 78-1 10 7 19 17 19h472c10 0 18-9 17-19-5-44-42-78-87-78zm0 128c-26 0-51 10-70 27-20-17-44-27-70-27s-51 10-70 27c-20-17-44-27-70-27s-51 10-70 27c-17-15-40-23-64-23-45 0-82 34-87 78-1 10 7 19 17 19h472c10 0 18-9 17-19-5-44-42-78-87-78z'/></svg>">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-grid.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css?v=2">
    <link rel="stylesheet" href="assets/css/dark.css?v=1">

    <style>
    </style>
    <style>
        .auth-container {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background-color: var(--background);
            overflow: hidden;
        }

        .auth-box {
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
            background: var(--surface);
            border-radius: 16px;
            box-shadow: var(--shadow-lg);
        }

        .logo-container {
            text-align: center;
            margin-bottom: 2rem;
        }

        .theme-toggle {
            position: fixed;
            top: 2rem;
            right: 2rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 1000;
            box-shadow: var(--shadow-sm);
        }

        @media (max-width: 768px) {
            .theme-toggle {
                top: 1rem;
                right: 1rem;
                width: 40px;
                height: 40px;
                background: transparent;
                border: none;
                box-shadow: none;
            }
        }

        .theme-toggle:hover {
            transform: scale(1.1);
        }

        .btn-light:hover {
            background-color: var(--primary) !important;
            border-color: var(--primary) !important;
        }

        .btn-light:hover span {
            color: white !important;
        }

        .text-primary:hover {
            text-decoration: underline !important;
            opacity: 0.8;
        }

        .theme-toggle i {
            font-size: 16px;
            color: var(--text-primary);
            transition: all 0.3s ease;
            display: block !important;
        }

        [data-theme="dark"] .theme-toggle i.fa-sun {
            color: #FFD700;
        }

        [data-theme="light"] .theme-toggle i.fa-moon {
            color: var(--text-primary);
        }
    </style>
</head>

<body>


    <!-- Theme Toggle -->
    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
        <i class="fas fa-moon" id="theme-icon"></i>
    </button>

    <div class="auth-container">
        <div class="auth-box">
            <div class="logo-container">
                <a href="index.html" class="logo text-primary fw-bold h3 mb-0 text-decoration-none">
                    <i class="fa-solid fa-water me-2"></i>SurfSchool
                </a>
            </div>
            <h1 class="h2 fw-bold mb-2 text-center">Welcome Back</h1>
            <p class="text-secondary mb-4 text-center">Please enter your details to sign in.</p>

            <form>
                <div class="mb-3">
                    <input type="email" class="form-control p-3 bg-light border-0 rounded-3"
                        placeholder="Enter your email">
                </div>
                <div class="mb-3">
                    <input type="password" class="form-control p-3 bg-light border-0 rounded-3" placeholder="••••••••">
                </div>
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <label class="d-flex align-items-center gap-2 text-secondary small">
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#" class="text-primary small text-decoration-none">Forgot password?</a>
                </div>
                <button class="btn btn-primary w-100 rounded-pill py-3 mb-4">Sign In</button>

                <div class="position-relative mb-4 text-center">
                    <hr class="text-secondary opacity-25">
                    <span
                        class="position-absolute top-50 start-50 translate-middle bg-surface px-3 text-secondary small"
                        style="background-color: var(--surface);">Or continue with</span>
                </div>

                <div class="d-flex gap-3 mb-4">
                    <button type="button"
                        class="btn btn-light w-100 py-2 d-flex align-items-center justify-content-center gap-2 border">
                        <img src="assets/images/google.svg" alt="Google" width="24" height="24">
                        <span class="text-secondary fw-medium">Google</span>
                    </button>
                    <button type="button"
                        class="btn btn-light w-100 py-2 d-flex align-items-center justify-content-center gap-2 border">
                        <img src="assets/images/facebook.svg" alt="Facebook" width="24" height="24">
                        <span class="text-secondary fw-medium">Facebook</span>
                    </button>
                </div>

                <div class="text-center">
                    <p class="text-secondary">Don't have an account? <a href="signup.html"
                            class="text-primary fw-bold text-decoration-none">Sign up</a></p>
                </div>
            </form>
        </div>
    </div>


    <script src="assets/js/theme-toggle.js"></script>

    <script>

    </script>
</body>

</html>
