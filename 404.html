<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | SurfSchool</title>
    <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16x16.png">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-grid.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css?v=2">
    <link rel="stylesheet" href="assets/css/dark.css?v=1">
    
    <style>
        /* Mobile Navigation */
        .mobile-menu-toggle {
            display: none;
            position: fixed;
            top: 1rem;
            left: 1rem;
            z-index: 1001;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.5rem 1rem;
            cursor: pointer;
            font-size: 1.2rem;
            color: var(--text-primary);
        }

        .mobile-nav-menu {
            position: fixed;
            top: 0;
            left: -100%;
            width: 280px;
            height: 100vh;
            background: var(--surface);
            border-right: 1px solid var(--border);
            transition: left 0.3s ease;
            z-index: 1000;
            padding: 4rem 1.5rem 2rem;
            overflow-y: auto;
        }

        .mobile-nav-menu.active {
            left: 0;
        }

        .mobile-nav-menu .logo {
            display: block;
            margin-bottom: 2rem;
            text-decoration: none;
        }

        .mobile-nav-menu .nav-links {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .mobile-nav-menu .nav-links li {
            margin-bottom: 1rem;
        }

        .mobile-nav-menu .nav-links a {
            display: block;
            padding: 0.75rem 1rem;
            color: var(--text-primary);
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .mobile-nav-menu .nav-links a:hover {
            background: var(--primary);
            color: white;
        }

        .mobile-nav-menu .nav-links a.active {
            background: var(--primary);
            color: white;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
            display: none;
        }

        .overlay.active {
            display: block;
        }

        @media (max-width: 768px) {
            .mobile-menu-toggle {
                display: block;
            }
        }
    </style>
</head>

<body class="d-flex align-items-center justify-content-center min-vh-100 bg-light text-center">
    <!-- Mobile Menu Toggle -->
    <button class="mobile-menu-toggle" id="mobile-menu-toggle">
        <i class="fas fa-bars"></i>
    </button>

    <!-- Mobile Navigation Menu -->
    <nav class="mobile-nav-menu" id="mobile-nav-menu">
        <a href="index.html" class="logo text-primary fw-bold h3 mb-0">
            <i class="fa-solid fa-water me-2"></i>SurfSchool
        </a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="programs.html">Programs</a></li>
            <li><a href="pricing.html">Pricing</a></li>
            <li><a href="blog.html">Blog</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="signup.html">Sign Up</a></li>
        </ul>
    </nav>

    <!-- Overlay -->
    <div class="overlay" id="overlay"></div>

    <div class="container">
        <h1 class="display-1 fw-bold text-primary mb-3">404</h1>
        <h2 class="h2 fw-bold text-dark mb-4">Wipeout! Page Not Found</h2>
        <p class="lead text-secondary mb-5">The wave you are looking for has crashed or doesn't exist.</p>
        <a href="index.html" class="btn btn-primary rounded-pill px-5 py-3">Paddle Back Home</a>
    </div>
    
    <script src="assets/js/theme-toggle.js"></script>
    
    <script>
        // Mobile menu toggle functionality
        const mobileMenuToggle = document.getElementById('mobile-menu-toggle');
        const mobileNavMenu = document.getElementById('mobile-nav-menu');
        const overlay = document.getElementById('overlay');

        mobileMenuToggle.addEventListener('click', () => {
            mobileNavMenu.classList.toggle('active');
            overlay.classList.toggle('active');
        });

        // Close mobile menu when clicking overlay
        overlay.addEventListener('click', () => {
            mobileNavMenu.classList.remove('active');
            overlay.classList.remove('active');
        });

        // Close mobile menu when clicking a link
        const navLinks = document.querySelectorAll('.nav-links a');
        navLinks.forEach(link => {
            link.addEventListener('click', () => {
                mobileNavMenu.classList.remove('active');
                overlay.classList.remove('active');
            });
        });

        // Highlight current page
        const currentPage = window.location.pathname.split('/').pop() || 'index.html';
        navLinks.forEach(link => {
            const linkPage = link.getAttribute('href');
            if (linkPage === currentPage) {
                link.classList.add('active');
            }
        });
    </script>
</body>

</html>
